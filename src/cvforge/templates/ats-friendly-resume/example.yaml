# CVForge Configuration
# Build: cvforge cv.yaml
# Check: cvforge ats-check cv.pdf
# CVForge renders sections in YAML order. Recommended order is below, but you can customize as needed.
# Required fields: name, role, email.
# Inline bold works in narrative text with double underscores, for example: __text__
# Language affects section headings only: "en" or "tr".
# Font options: "noto", "roboto", "liberation", "dejavu", "inter", "lato", "montserrat", "raleway", "ubuntu", "opensans", "sourcesans", "arial", "times", "calibri", "georgia", "garamond", "trebuchet"
language: "en"
font: "noto"

# Personal Information (name, role, and email must be non-empty text)
name: "Your Name"
role: "Your Title / Role"
email: "your.email@example.com"
phone: "+1 555 123 4567"
location: "City, Country"
website: "yourwebsite.com"
# website-text: "Portfolio" # Optional: Custom display text (default: "Website")
linkedin: "linkedin.com/in/yourprofile"
# linkedin-text: "LinkedIn Profile" # Optional: Custom display text (default: "LinkedIn")
github: "github.com/yourusername"
# github-text: "GitHub Profile" # Optional: Custom display text (default: "GitHub")
# photo: "photo.png"  # Optional: path is resolved relative to this YAML file
# photo-width: "2.5cm"  # Optional: safe examples: "3cm", "2in", "80pt"

# Professional Summary
summary: |
  A brief professional summary describing your __experience__, expertise, and career goals.
  Keep it concise and impactful, typically 2-3 sentences.

# Technical Skills (must be a list of groups with Category and Items)
skills:
  - Category: "Programming Languages"
    Items: ["Python", "JavaScript", "TypeScript", "Go"]
  - Category: "Frameworks & Libraries"
    Items: ["React", "Node.js", "Django", "FastAPI"]
  - Category: "Tools & Platforms"
    Items: ["Docker", "Kubernetes", "AWS", "Git"]

# Work Experience (description must be a list of bullet strings)
experience:
  - company: "Company Name"
    role: "Job Title"
    date: "2022 - Present"
    location: "City, Country"  # Optional
    description:
      - "Achievement or responsibility with __measurable impact__"
      - "Another key accomplishment or project"
      - "Technical skills applied or leadership demonstrated"

  - company: "Previous Company"
    role: "Previous Role"
    date: "2020 - 2022"
    description:
      - "Key achievement in this role"
      - "Notable project or contribution"

# Projects (optional; description must be a list of bullet strings)
projects:
  - name: "Project Name"
    date: "2023"
    url: "github.com/username/project"  # Optional
    # url-text: "View Code" # Optional: Custom display text (default: shows raw URL)
    role: "Lead Developer"  # Optional
    description:
      - "Brief description of the project and your contribution"
      - "Technologies used and impact achieved"

# Education (description bullets are optional)
education:
  - school: "University Name"
    degree: "Degree Type in Field of Study"
    date: "2016 - 2020"
    location: "City, Country"  # Optional
    gpa: "3.8/4.0"  # Optional

# Certifications (optional list)
certifications:
  - name: "AWS Solutions Architect"
    issuer: "Amazon Web Services"
    date: "2023"

# Awards (optional list)
awards:
  - name: "Employee of the Year"
    issuer: "Company Name"
    date: "2022"

# Languages (optional list)
languages:
  - name: "English"
    level: "Native"
  - name: "Spanish"
    level: "Professional"

# Interests (optional list of strings)
interests: ["Open Source", "Machine Learning", "Photography"]
